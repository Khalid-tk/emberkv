name: CI

on:
  push:
  pull_request:

jobs:
  build-and-test:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: "Linux GCC",    os: ubuntu-24.04, cxx: g++-13 }
          - { name: "Linux Clang",  os: ubuntu-24.04, cxx: clang++-18 }
          - { name: "macOS Clang",  os: macos-15,     cxx: clang++ }
          - { name: "Windows MSVC", os: windows-2022, cxx: "" }
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        shell: bash
        run: |
          if [ -n "${{ matrix.cxx }}" ]; then export CXX=${{ matrix.cxx }}; fi
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DEMBERKV_WERROR=ON
      - name: Build
        run: cmake --build build --config Release --parallel
      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure --timeout 120

  sanitizers:
    name: Sanitizer (${{ matrix.sanitizer }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        sanitizer: ["address,undefined", "thread"]
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug -DEMBERKV_BUILD_BENCH=OFF -DEMBERKV_SANITIZE=${{ matrix.sanitizer }}
      - name: Build
        run: cmake --build build --parallel
      - name: Test
        run: ctest --test-dir build --output-on-failure --timeout 300

  poll-backend:
    name: Linux poll() backend
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DEMBERKV_FORCE_POLL=ON -DEMBERKV_BUILD_BENCH=OFF
      - run: cmake --build build --parallel
      - run: ctest --test-dir build --output-on-failure
